# The tmux server of Octopus AI sessions: `tmux -L octopus -f <this file>`, one per machine,
# apart from any tmux server of the owner's. Read once, when that server starts.
#
# A session looks like a plain terminal: no status line, the window title is the session's
# title, and the mouse wheel scrolls back through its output.
set -g status off
set -g mouse on
set -g history-limit 50000
set -sg escape-time 10
set -g focus-events on
set -g set-titles on
set -g set-titles-string "#T"
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:RGB"
set-environment -g COLORTERM truecolor
set -g window-size latest
setw -g aggressive-resize on
